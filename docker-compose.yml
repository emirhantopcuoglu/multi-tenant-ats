services:
  postgres:
    image: postgres:16
    container_name: ats-postgres
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ats-postgres-data:/var/lib/postgresql/data

volumes:
  ats-postgres-data: