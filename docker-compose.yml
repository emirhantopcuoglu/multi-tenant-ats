# `docker compose up -d` starts the infrastructure only. `docker compose --profile app up -d --build`
# also runs migrations, the API (http://localhost:5236) and the web app (http://localhost:8080).

x-api-environment: &api-environment
  ASPNETCORE_ENVIRONMENT: Production
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ats;Username=ats;Password=ats_dev_password
  Mongo__ConnectionString: mongodb://mongo:27017
  Redis__ConnectionString: redis:6379
  RabbitMq__Host: rabbitmq
  RabbitMq__Username: ${RABBITMQ_USER:-ats}
  RabbitMq__Password: ${RABBITMQ_PASSWORD:-ats_dev_password}
  Email__Host: mailhog
  FileStorage__Endpoint: minio:9000
  FileStorage__PublicEndpoint: localhost:9000
  FileStorage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
  FileStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
  OpenTelemetry__OtlpEndpoint: http://jaeger:4317
  Serilog__WriteTo__1__Args__serverUrl: http://seq:5341
  # No default on purpose: the API refuses to start without a 32+ byte secret.
  Jwt__Secret: ${JWT_SECRET:-}
  Llm__ApiKey: ${LLM_API_KEY:-}
  Cors__AllowedOrigins__0: ${WEB_URL:-http://localhost:8080}
  Invitation__AcceptBaseUrl: ${WEB_URL:-http://localhost:8080}/accept-invitation
  PasswordReset__ResetBaseUrl: ${WEB_URL:-http://localhost:8080}/reset-password
  CandidateEmailChange__ConfirmBaseUrl: ${WEB_URL:-http://localhost:8080}/candidate/confirm-email
  CandidatePasswordReset__ResetBaseUrl: ${WEB_URL:-http://localhost:8080}/candidate/reset-password
  CandidateEmailVerification__ConfirmBaseUrl: ${WEB_URL:-http://localhost:8080}/candidate/verify-email
  EmailConfirmation__ConfirmBaseUrl: ${WEB_URL:-http://localhost:8080}/confirm-email
  InterviewRoom__BaseUrl: ${WEB_URL:-http://localhost:8080}/interview-room

services:
  migrate:
    profiles: [app]
    build: .
    image: ats-api
    command: ["migrate"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: .
    image: ats-api
    container_name: ats-api
    environment: *api-environment
    ports:
      - "5236:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started

  # The API URL is baked in at build time (Vite inlines VITE_ vars), so it's a build arg.
  web:
    profiles: [app]
    build:
      context: ./src/Ats.Web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5236}
    container_name: ats-web
    ports:
      - "8080:80"
    depends_on:
      - api

  postgres:
    image: postgres:16
    container_name: ats-postgres
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_dev_password
    ports:
      - "5434:5432"
    volumes:
      - ats-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats -d ats"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    container_name: ats-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    # minio/minio is no longer published on Docker Hub; Chainguard builds the same server.
    image: cgr.dev/chainguard/minio:latest
    container_name: ats-minio
    command: server /data --console-address ":9001"
    environment:
      # Dev defaults so `docker compose up` works with no .env; override via environment
      # for anything shared or non-local. The API authenticates with the same credentials.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - ats-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    container_name: ats-mongo
    # No MONGO_INITDB_ROOT_* on purpose: dev runs without authentication, like the local
    # Postgres setup. A shared or remote MongoDB must enable auth and use a credentialed
    # connection string from User Secrets / environment variables.
    ports:
      - "27017:27017"
    volumes:
      - ats-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: ats-redis
    # No volume on purpose: this is a cache, not a store. Everything in it (the slug -> tenantId
    # lookup) is rebuildable from PostgreSQL, so losing it on restart costs only a few cache misses.
    # That disposability is exactly why a cache may go down without breaking the app.
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ats-rabbitmq
    environment:
      # A dedicated dev user, mirroring the Postgres setup. The built-in `guest` account is restricted
      # to loopback connections; the API runs on the host and reaches the broker through Docker's port
      # mapping, so the connection is not seen as loopback and `guest` would be rejected. Override for
      # anything shared or non-local.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ats}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ats_dev_password}
    ports:
      - "5672:5672"    # AMQP protocol (the API connects here)
      - "15672:15672"  # management UI (http://localhost:15672)
    volumes:
      # Unlike Redis, the broker is a store: it must not drop messages that are in flight or waiting in
      # durable queues across a restart. The outbox relies on this durability.
      - ats-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ats-jaeger
    environment:
      # Enable the OTLP receiver so the app can send spans directly via gRPC/HTTP.
      # The UI at http://localhost:16686 shows traces; 4317/4318 are the ingestion ports.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # web UI
      - "4317:4317"    # OTLP gRPC (Serilog / OTel SDK sends here)
      - "4318:4318"    # OTLP HTTP

  seq:
    image: datalust/seq:latest
    container_name: ats-seq
    environment:
      # No authentication — dev-only convenience. Set SEQ_FIRSTRUN_ADMINPASSWORDHASH and remove
      # SEQ_FIRSTRUN_NOAUTHENTICATION for shared or staging. See https://docs.datalust.co/docs/getting-started-with-docker
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"  # ingestion (Serilog Seq sink points here)
      - "8081:80"    # web UI — http://localhost:8081
    volumes:
      - ats-seq-data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: ats-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    ports:
      - "9090:9090"  # web UI + query API
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ats-prometheus-data:/prometheus
    # Allows scraping from the host machine (where the API runs) on Windows / Mac Docker Desktop.
    # On Linux replace host.docker.internal with host-gateway via extra_hosts.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: ats-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"  # web UI — http://localhost:3000
    volumes:
      - ats-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  ats-postgres-data:
  ats-minio-data:
  ats-mongo-data:
  ats-rabbitmq-data:
  ats-seq-data:
  ats-jaeger-data:
  ats-prometheus-data:
  ats-grafana-data: