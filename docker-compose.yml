services:
  # The built SPA served by nginx (Sprint 8.1, Step 6.1). The API base URL is baked in at build time
  # (Vite inlines VITE_-prefixed vars), so it's a build arg. The default targets the API running on the
  # host's dev port; override VITE_API_BASE_URL for a real deployment. Note: the API's CORS
  # AllowedOrigins must include this origin (http://localhost:8080) for the browser calls to succeed.
  web:
    build:
      context: ./src/Ats.Web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5236}
    container_name: ats-web
    ports:
      - "8080:80"

  postgres:
    image: postgres:16
    container_name: ats-postgres
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats_dev_password
    ports:
      - "5434:5432"
    volumes:
      - ats-postgres-data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    container_name: ats-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio
    container_name: ats-minio
    command: server /data --console-address ":9001"
    environment:
      # Dev defaults so `docker compose up` works with no .env; override via environment
      # for anything shared or non-local. The API authenticates with the same credentials.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # web console
    volumes:
      - ats-minio-data:/data

  mongo:
    image: mongo:7
    container_name: ats-mongo
    # No MONGO_INITDB_ROOT_* on purpose: dev runs without authentication, like the local
    # Postgres setup. A shared or remote MongoDB must enable auth and use a credentialed
    # connection string from User Secrets / environment variables.
    ports:
      - "27017:27017"
    volumes:
      - ats-mongo-data:/data/db

  redis:
    image: redis:7
    container_name: ats-redis
    # No volume on purpose: this is a cache, not a store. Everything in it (the slug -> tenantId
    # lookup) is rebuildable from PostgreSQL, so losing it on restart costs only a few cache misses.
    # That disposability is exactly why a cache may go down without breaking the app.
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ats-rabbitmq
    environment:
      # A dedicated dev user, mirroring the Postgres setup. The built-in `guest` account is restricted
      # to loopback connections; the API runs on the host and reaches the broker through Docker's port
      # mapping, so the connection is not seen as loopback and `guest` would be rejected. Override for
      # anything shared or non-local.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ats}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ats_dev_password}
    ports:
      - "5672:5672"    # AMQP protocol (the API connects here)
      - "15672:15672"  # management UI (http://localhost:15672)
    volumes:
      # Unlike Redis, the broker is a store: it must not drop messages that are in flight or waiting in
      # durable queues across a restart. This durability is what the Sprint 5.3 outbox will build on.
      - ats-rabbitmq-data:/var/lib/rabbitmq

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ats-jaeger
    environment:
      # Enable the OTLP receiver so the app can send spans directly via gRPC/HTTP.
      # The UI at http://localhost:16686 shows traces; 4317/4318 are the ingestion ports.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # web UI
      - "4317:4317"    # OTLP gRPC (Serilog / OTel SDK sends here)
      - "4318:4318"    # OTLP HTTP

  seq:
    image: datalust/seq:latest
    container_name: ats-seq
    environment:
      # No authentication — dev-only convenience. Set SEQ_FIRSTRUN_ADMINPASSWORDHASH and remove
      # SEQ_FIRSTRUN_NOAUTHENTICATION for shared or staging. See https://docs.datalust.co/docs/getting-started-with-docker
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"  # ingestion (Serilog Seq sink points here)
      - "8081:80"    # web UI — http://localhost:8081
    volumes:
      - ats-seq-data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: ats-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    ports:
      - "9090:9090"  # web UI + query API
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ats-prometheus-data:/prometheus
    # Allows scraping from the host machine (where the API runs) on Windows / Mac Docker Desktop.
    # On Linux replace host.docker.internal with host-gateway via extra_hosts.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: ats-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"  # web UI — http://localhost:3000
    volumes:
      - ats-grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  ats-postgres-data:
  ats-minio-data:
  ats-mongo-data:
  ats-rabbitmq-data:
  ats-seq-data:
  ats-jaeger-data:
  ats-prometheus-data:
  ats-grafana-data: