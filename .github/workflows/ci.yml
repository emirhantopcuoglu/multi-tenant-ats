name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Fast gate: unit + architecture tests with no external dependencies.
  # Integration tests and docker-build only run when this job is green.
  unit-and-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      # The backend counterpart of the web job's lint step. Placed before the build so a formatting
      # slip fails in seconds rather than after a full compile.
      - name: Check formatting
        run: dotnet format --no-restore --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test tests/Ats.UnitTests/Ats.UnitTests.csproj \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage/

      - name: Architecture tests
        run: |
          dotnet test tests/Ats.ArchitectureTests/Ats.ArchitectureTests.csproj \
            --no-build --configuration Release

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Integration tests require Docker (Testcontainers pulls postgres:17-alpine).
  # ubuntu-latest runners have Docker pre-installed.
  integration:
    needs: unit-and-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        run: |
          dotnet test tests/Ats.IntegrationTests/Ats.IntegrationTests.csproj \
            --no-build --configuration Release

  # Builds the API image and boots it with its dependencies. Bus, DI and config errors only show up
  # at runtime, so no other job catches them.
  docker-build:
    needs: unit-and-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate a JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start the API and its dependencies
        run: docker compose --profile app up -d --build api

      - name: Wait for /health/ready
        run: |
          for attempt in $(seq 1 60); do
            curl -fsS http://localhost:5236/health/ready && exit 0
            sleep 5
          done
          exit 1

      - name: Show logs
        if: failure()
        run: docker compose --profile app logs migrate api

  # Lints, tests, type-checks and builds the React SPA. Independent of the .NET jobs (no `needs`), so
  # it runs in parallel and gives the frontend its own pass/fail signal.
  #
  # The three steps answer different questions and none replaces another: eslint catches hazards the
  # compiler cannot see (a conditional hook, a stale effect dependency), vitest checks the logic is
  # right, and `npm run build` — `tsc -b && vite build` — proves the types hold and the bundle is
  # producible. Type-checking is not testing: tsc confirms a function returns a string, never that it
  # returns the right one.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Ats.Web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          # Restore the npm cache keyed off the lockfile, so unchanged deps aren't re-downloaded.
          cache: npm
          cache-dependency-path: src/Ats.Web/package-lock.json

      # `npm ci` installs exactly what package-lock.json pins (reproducible), unlike `npm install`
      # which may resolve newer versions and mutate the lockfile.
      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first so an obvious mistake fails in seconds rather than after a bundle.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Type-check and build
        run: npm run build
