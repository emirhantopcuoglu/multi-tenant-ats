name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Fast gate: unit + architecture tests with no external dependencies.
  # Integration tests and docker-build only run when this job is green.
  unit-and-arch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test tests/Ats.UnitTests/Ats.UnitTests.csproj \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage/

      - name: Architecture tests
        run: |
          dotnet test tests/Ats.ArchitectureTests/Ats.ArchitectureTests.csproj \
            --no-build --configuration Release

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Integration tests require Docker (Testcontainers pulls postgres:17-alpine).
  # ubuntu-latest runners have Docker pre-installed.
  integration:
    needs: unit-and-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Integration tests
        run: |
          dotnet test tests/Ats.IntegrationTests/Ats.IntegrationTests.csproj \
            --no-build --configuration Release

  # Validates the Dockerfile builds a runnable image.
  # Runs in parallel with integration after the fast gate passes.
  docker-build:
    needs: unit-and-arch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ats-api:ci .

  # Lints, tests, type-checks and builds the React SPA. Independent of the .NET jobs (no `needs`), so
  # it runs in parallel and gives the frontend its own pass/fail signal.
  #
  # The three steps answer different questions and none replaces another: eslint catches hazards the
  # compiler cannot see (a conditional hook, a stale effect dependency), vitest checks the logic is
  # right, and `npm run build` — `tsc -b && vite build` — proves the types hold and the bundle is
  # producible. Type-checking is not testing: tsc confirms a function returns a string, never that it
  # returns the right one.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Ats.Web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Restore the npm cache keyed off the lockfile, so unchanged deps aren't re-downloaded.
          cache: npm
          cache-dependency-path: src/Ats.Web/package-lock.json

      # `npm ci` installs exactly what package-lock.json pins (reproducible), unlike `npm install`
      # which may resolve newer versions and mutate the lockfile.
      - name: Install dependencies
        run: npm ci

      # Ordered cheapest-first so an obvious mistake fails in seconds rather than after a bundle.
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Type-check and build
        run: npm run build
