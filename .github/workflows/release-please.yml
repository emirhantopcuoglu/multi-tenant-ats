name: release-please

# Watches main. On each push (i.e. each develop -> main release merge) it parses
# Conventional Commits since the last tag, opens/updates a release PR that bumps
# the version and updates CHANGELOG.md, and — when that PR is merged — creates the
# git tag and GitHub Release. Versioning is derived from commit types, not by hand.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
