global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ats-api
    # host.docker.internal resolves to the host machine from inside Docker Desktop on Windows/Mac.
    # On Linux set PROMETHEUS_HOST=172.17.0.1 (or the Docker bridge IP) via environment variable,
    # or use extra_hosts: ["host.docker.internal:host-gateway"] in docker-compose.
    static_configs:
      # The first is `dotnet run`, the second the compose api service; one of them is always down.
      - targets: ["host.docker.internal:9464", "api:9464"]
    metrics_path: /metrics
